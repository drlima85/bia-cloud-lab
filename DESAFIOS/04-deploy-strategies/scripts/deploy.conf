# ==============================================================================
# deploy.conf — Configurações de Ambientes e Parâmetros Padrão do BIA Cloud Lab
# Trilha: Estratégias de Deploy & Resiliência (Desafio 02)
# ==============================================================================
# NOTA DE PORTABILIDADE E SEGURANÇA:
# Todas as variáveis podem ser sobrescritas externamente através de arquivo .env
# ou variáveis de ambiente de processo.
# ==============================================================================

# Ambiente padrão ativo caso a flag -E / --env não seja informada
DEFAULT_ENV="${DEFAULT_ENV:-app}"

# Parâmetros gerais AWS (valores padrão com override por variáveis padrão da AWS)
DEFAULT_PROFILE="${AWS_PROFILE:-${DEFAULT_PROFILE:-agy-aws-lab}}"
DEFAULT_REGION="${AWS_REGION:-${DEFAULT_REGION:-us-east-2}}"
DEFAULT_ECR_REPO="${DEFAULT_ECR_REPO:-bia-cloud-lab}"
DEFAULT_TIMEOUT="${DEFAULT_TIMEOUT:-600}"

# ------------------------------------------------------------------------------
# Definição dos Ambientes Homologados no Laboratório
# ------------------------------------------------------------------------------

# Ambiente 1: "app" (Principal do laboratório - cluster-bia-app / service-bia-cloud-app)
ENV_APP_NAME="app"
ENV_APP_DESC="Ambiente Principal BIA Cloud App (ALB + EC2)"
ENV_APP_CLUSTER="${ENV_APP_CLUSTER:-cluster-bia-app}"
ENV_APP_SERVICE="${ENV_APP_SERVICE:-service-bia-cloud-app}"
ENV_APP_TASK_FAMILY="${ENV_APP_TASK_FAMILY:-task-def-bia-cloud-app}"
ENV_APP_CONTAINER_NAME="${ENV_APP_CONTAINER_NAME:-bia-cloud-app}"
# URL do ALB: configurável via .env ou variável ENV_APP_ALB_URL
ENV_APP_ALB_URL="${ENV_APP_ALB_URL:-http://localhost:8080/api/versao}"
# Baseline inicial homologada (Governança SRE: status ACTIVE no ECS não indica homologação)
ENV_APP_HOMOLOGATED_BASELINE="${ENV_APP_HOMOLOGATED_BASELINE:-15}"

# Ambiente 2: "alb" (Segundo serviço do laboratório - cluster-bia-app / service-bia-cloud-alb)
ENV_ALB_NAME="alb"
ENV_ALB_DESC="Ambiente Secundário BIA Cloud ALB"
ENV_ALB_CLUSTER="${ENV_ALB_CLUSTER:-cluster-bia-app}"
ENV_ALB_SERVICE="${ENV_ALB_SERVICE:-service-bia-cloud-alb}"
ENV_ALB_TASK_FAMILY="${ENV_ALB_TASK_FAMILY:-task-def-bia-cloud-alb}"
ENV_ALB_CONTAINER_NAME="${ENV_ALB_CONTAINER_NAME:-bia-cloud-alb}"
ENV_ALB_ALB_URL="${ENV_ALB_ALB_URL:-http://localhost:8080/}"
ENV_ALB_HOMOLOGATED_BASELINE="${ENV_ALB_HOMOLOGATED_BASELINE:-1}"

# Ambiente 3: "didatico" (Compatibilidade com enunciado teórico Formação AWS)
ENV_DIDATICO_NAME="didatico"
ENV_DIDATICO_DESC="Ambiente Didático Teórico Formação AWS (cluster-bia / service-bia)"
ENV_DIDATICO_CLUSTER="${ENV_DIDATICO_CLUSTER:-cluster-bia}"
ENV_DIDATICO_SERVICE="${ENV_DIDATICO_SERVICE:-service-bia}"
ENV_DIDATICO_TASK_FAMILY="${ENV_DIDATICO_TASK_FAMILY:-task-def-bia}"
ENV_DIDATICO_CONTAINER_NAME="${ENV_DIDATICO_CONTAINER_NAME:-bia}"
ENV_DIDATICO_ALB_URL="${ENV_DIDATICO_ALB_URL:-http://localhost:8080/api/versao}"
ENV_DIDATICO_HOMOLOGATED_BASELINE="${ENV_DIDATICO_HOMOLOGATED_BASELINE:-1}"
